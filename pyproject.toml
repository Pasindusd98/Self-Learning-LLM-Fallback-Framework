[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cascade-framework"
version = "0.1.0"
description = "Confidence-gated model cascading: learn repetitive AI tasks locally, escalate to a third-party LLM only when needed."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "SQLAlchemy>=2.0",
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "sentence-transformers>=2.5",
    "anthropic>=0.34",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
generative = ["torch>=2.2", "transformers>=4.40", "peft>=0.10", "trl>=0.8"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.setuptools.packages.find]
include = ["cascade*"]
